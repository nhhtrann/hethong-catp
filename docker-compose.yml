version: '3.8'

services:
  catp-backend:
    build: 
      context: ./backend-catp
    container_name: catp_backend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./backend-catp:/app              
      - /app/node_modules
      - ./backend-catp/uploads:/app/uploads                 
    command: npm run start:dev           

  catp-frontend:
    build: 
      context: ./frontend-catp
    container_name: catp_frontend
    restart: always
    ports:
      - "5173:80" 
    depends_on:
      - catp-backend
  

